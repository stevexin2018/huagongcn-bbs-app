name: Build Windows and Android Releases

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Create Platform Skeletons
        run: flutter create --project-name=huagongcn_bbs_app --platforms=android .

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: huagongcn-bbs-android
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Build Windows x64 App
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up Visual Studio Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Create Windows Skeletons
        run: flutter create --project-name=huagongcn_bbs_app --platforms=windows .

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Application
        run: flutter build windows --release

      - name: Compress Windows Application
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath huagongcn-bbs-windows-x64-release.zip

      - name: Upload Windows Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: huagongcn-bbs-windows-x64
          path: huagongcn-bbs-windows-x64-release.zip

      - name: Upload Windows Zip to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v0.1.0-alpha
          files: huagongcn-bbs-windows-x64-release.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
